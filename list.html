<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping list · ShopPing</title>
<meta name="robots" content="noindex">
<meta name="description" content="Open a shopping list someone shared with you in ShopPing.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Karla:ital,wght@0,400;0,500;0,600;0,700&display=swap">
<style>
  :root {
    --paper: #fcf9f6;
    --paper-tint: #f7f0e9;
    --ink: #271a13;
    --ink-soft: #6b584c;
    --blue: #2563eb;
    --sand: #e7dacd;
    --radius-lg: 22px;
    --radius-md: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c130e;
      --paper-tint: #241a13;
      --ink: #f4ece3;
      --ink-soft: #c3ab98;
      --blue: #60a5fa;
      --sand: #3a2a1e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--paper);
    color: var(--ink);
    font-family: Karla, system-ui, -apple-system, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--paper-tint);
    border: 1px solid var(--sand);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    text-align: center;
  }
  h1 {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-size: 1.5rem;
    margin: 0 0 6px;
  }
  .store { color: var(--ink-soft); margin: 0 0 20px; font-size: 0.95rem; }
  ul {
    list-style: none;
    margin: 0 0 22px;
    padding: 0;
    text-align: left;
    border-top: 1px solid var(--sand);
  }
  li {
    padding: 10px 4px;
    border-bottom: 1px solid var(--sand);
    font-size: 0.95rem;
  }
  .btn {
    display: block;
    background: var(--blue);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    padding: 14px 18px;
    border-radius: var(--radius-md);
    margin-bottom: 12px;
  }
  .hint { color: var(--ink-soft); font-size: 0.82rem; line-height: 1.5; margin: 0; }
  .hint a { color: var(--blue); }
</style>

<link rel="canonical" href="https://shopping.nghive.app/list">
<meta property="og:url" content="https://shopping.nghive.app/list">
<meta property="og:title" content="Shopping list · ShopPing">
<meta property="og:description" content="Open a shopping list someone shared with you in ShopPing.">
<meta property="og:image" content="https://shopping.nghive.app/share-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="https://shopping.nghive.app/share-card.png">
<meta property="og:site_name" content="ShopPing">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div class="card">
  <h1 id="title">Shopping list</h1>
  <p class="store" id="store"></p>
  <ul id="items"></ul>
  <a class="btn" id="open" href="#">Open in ShopPing</a>
  <p class="hint">
    Nothing happens? You may not have the app yet —
    <a href="https://apps.apple.com/app/id6802057059">get ShopPing on the App Store</a>,
    then tap the link again.
  </p>
</div>

<script>
  // The list travels in the URL fragment, which browsers never send to the
  // server — so what someone shared stays between their phone and yours, and
  // never reaches this site's host. This page only re-hands it to the app.
  (function () {
    var hash = location.hash.slice(1);
    // Links made before September 2026 carry percent-encoded JSON after
    // "d="; newer ones are base64url and take up about a third of the room.
    var legacy = /^d=(.+)$/.exec(hash);
    var openLink = document.getElementById('open');

    if (!hash) {
      document.getElementById('store').textContent =
        'This link is missing its list. Ask for it to be sent again.';
      openLink.style.display = 'none';
      return;
    }

    openLink.href = legacy ? 'shopping://list?d=' + legacy[1] : 'shopping://list#' + hash;

    // Preview the contents so the page is useful even without the app
    // installed. Anything malformed just shows no preview — the app does its
    // own validation, this is only a courtesy.
    try {
      var storeName = null;
      var names = [];

      if (legacy) {
        var data = JSON.parse(decodeURIComponent(legacy[1]));
        storeName = data && data.storeName;
        (data && data.items ? data.items : []).forEach(function (item) {
          if (item && typeof item.name === 'string') names.push(item.name);
        });
      } else {
        var bin = atob(hash.replace(/-/g, '+').replace(/_/g, '/'));
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var lines = new TextDecoder().decode(bytes).split('\n');
        var head = lines.shift() || '';
        // A chain sends "c<id>" plus its display name; anything else sends
        // "n<name>". Either way the name is what goes in the heading.
        var headParts = head.split('\t');
        storeName = head.charAt(0) === 'c' ? headParts[1] || null : headParts[0].slice(1);
        lines.forEach(function (line) {
          var name = line.split('\t')[0];
          if (name) names.push(name);
        });
      }

      if (storeName) document.getElementById('store').textContent = storeName;
      var list = document.getElementById('items');
      names.slice(0, 200).forEach(function (name) {
        var li = document.createElement('li');
        li.textContent = name;
        list.appendChild(li);
      });
    } catch (e) {
      /* no preview, the button still works */
    }
  })();
</script>
</body>
</html>
